# Local development configuration for the Stryder Supabase project.
# The hosted project lives in the EU West region (GDPR / EU data residency,
# non-negotiable rule 5). This file only configures `supabase start` locally.

project_id = "stryder"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Local mail catcher. Production email goes through Supabase Auth's provider.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "env(NEXT_PUBLIC_APP_URL)"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false  # local only; keep confirmations ON in production
secure_password_change = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"

# Apple and Strava OAuth are later phases (see docs/DECISIONS.md).

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
